<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Surah Name Preview</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Aref+Ruqaa:wght@700&family=Reem+Kufi:wght@600&display=swap" rel="stylesheet">
<style>
body{margin:0;padding:24px 16px;background:#fff;color:#222;font:15px/1.5 system-ui,sans-serif}
.grid{display:grid;gap:16px;max-width:900px;margin:auto}
.card{border:1px solid #e5e5e5;border-radius:14px;padding:18px;text-align:center}
.name{direction:rtl;font-size:clamp(48px,10vw,84px);line-height:1.6;margin:0}
.s{color:#9a9a9a}.n{color:#4b0f7f}
.a{font-family:"Amiri",serif}.r{font-family:"Aref Ruqaa",serif}.k{font-family:"Reem Kufi",sans-serif}
small{color:#666}
</style></head><body>
<div class="grid">
<div class="card"><p class="name a"><span class="s">سُورَةُ</span> <span class="n">الفَاتِحَة</span></p><small>Option 1 · Amiri (Naskh, classic)</small></div>
<div class="card"><p class="name r"><span class="s">سُورَةُ</span> <span class="n">الفَاتِحَة</span></p><small>Option 2 · Aref Ruqaa (Ruqʿah, handwritten style)</small></div>
<div class="card"><p class="name k"><span class="s">سورة</span> <span class="n">الفاتحة</span></p><small>Option 3 · Reem Kufi (Kufi, modern)</small></div>
</div>
</body></html>
