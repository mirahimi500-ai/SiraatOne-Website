<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tasbih — SiraatOne</title>
<meta name="description" content="A simple tasbih counter with targets and named counters, saved in your browser.">
<meta name="theme-color" content="#2E7D32">
<link rel="icon" href="../assets/img/logo.png">
<script>try{var d=document.documentElement,t=localStorage.getItem('theme');if(t==='oled'){d.setAttribute('data-theme','dark');d.classList.add('oled')}else if(t==='light'||t==='dark')d.setAttribute('data-theme',t);if(localStorage.getItem('rm')==='1')d.classList.add('rm')}catch(e){}</script>
<link rel="stylesheet" href="../assets/css/style.css?v=20261102i">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="site-header">
  <div class="wrap">
    <div class="bar">
      <a class="logo" href="../"><img src="../assets/img/logo.png" alt="" width="36" height="36">SiraatOne</a>
      <div class="bar-actions">
        <button id="theme-toggle" class="icon-btn" type="button" aria-label="Switch theme">☾</button>
        <button id="menu-btn" class="icon-btn menu-btn" type="button" aria-controls="site-nav" aria-expanded="false" aria-label="Menu">☰</button>
      </div>
    </div>
    <nav id="site-nav" class="nav" aria-label="Main">
      <a href="../">Home</a>
      <a href="../read/">Quran</a>
      <a href="../quran/">Quran app</a>
      <a href="../azan/">Azan app</a>
      <a href="../support/">Support</a>
      <a href="../privacy/">Privacy</a>
      <a href="../terms/">Terms &amp; Credits</a>
    </nav>
  </div>
</header>

<main id="main" class="wrap tool">
  <header class="tool-head"><h1>Tasbih</h1><p class="sub">Tap the circle or press Space. Saved in this browser only.</p></header>
  <div class="tb-profiles" id="tb-prof"></div>
  <button type="button" class="tb-ring" id="tb-tap" aria-label="Count"><span id="tb-n">0</span><small id="tb-goal"></small></button>
  <div class="tb-row">
    <label>Target <select id="tb-target"><option value="0">None</option><option>33</option><option>34</option><option>99</option><option>100</option><option value="c">Custom…</option></select></label>
    <button type="button" class="btn btn-ghost sm" id="tb-undo">−1</button>
    <button type="button" class="btn btn-ghost sm" id="tb-reset">Reset</button>
  </div>
  <div class="tb-opts">
    <label><input type="checkbox" id="tb-vib"> Vibrate (phones)</label>
    <label><input type="checkbox" id="tb-snd"> Sound at target</label>
    <label><input type="checkbox" id="tb-conf"> Confirm before reset</label>
    <label><input type="checkbox" id="tb-stats"> Show statistics</label>
  </div>
  <p class="tb-stats" id="tb-st"></p>
</main>

<script src="../assets/js/site.js?v=20261102i" defer></script>
<script src="../assets/js/lib.js?v=20261102i" defer></script>
<script src="../assets/js/tasbih.js?v=20261102i" defer></script>
</body>
</html>
